# Builds the web version of the app on every change and publishes it to the
# gh-pages branch, which GitHub Pages serves at
# https://ayenew-tadesse.github.io/guxo-flights-app/
# (Settings → Pages → Source: Deploy from a branch → gh-pages, / (root)).
# Pull requests only check that the app builds.
name: Web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo export --platform web
      # Pages serves 404.html for links like /guxo-flights-app/book: it's the
      # app itself, which then opens the right screen. .nojekyll keeps the
      # _expo folder (Jekyll would drop folders starting with "_").
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        working-directory: dist
        run: |
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish web app from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
